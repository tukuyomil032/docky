# SwiftLint configuration for Docky
# Lenient baseline — only flag issues that indicate clear bugs or dead code.
# Stylistic and complexity rules are disabled to avoid touching existing code.

included:
  - Docky
  - Tests

excluded:
  - .build
  - DerivedData
  - Pods
  - .swiftpm
  - Docky/Assets.xcassets

disabled_rules:
  # Style / formatting — leave existing code untouched
  - line_length
  - trailing_whitespace
  - trailing_newline
  - leading_whitespace
  - vertical_whitespace
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces
  - opening_brace
  - closing_brace
  - comma
  - colon
  - statement_position
  - control_statement
  - function_name_whitespace
  - return_arrow_whitespace
  - type_name
  - identifier_name
  - function_parameter_count
  - multiple_closures_with_trailing_closure
  - redundant_discardable_let

  # Trailing commas — project intentionally uses them throughout
  - trailing_comma

  # Void-in-ternary pattern used deliberately in project
  - void_function_in_ternary

  # Style improvements that change existing idioms
  - is_disjoint
  - for_where
  - unused_enumerated
  - comment_spacing
  - implicit_optional_initialization
  - unneeded_override

  # Complexity & size — existing services are intentionally large
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - large_tuple

  # Force usage — project deliberately uses these in some places
  - force_cast
  - force_unwrapping
  - force_try

  # Discouraged but common in this codebase
  - nesting
  - todo
  - orphaned_doc_comment
  - explicit_type_interface
  - missing_docs
  - attributes

  # Class/struct design rules — not enforced here
  - required_deinit
  - overridden_super_call

  # Other nits that do not affect correctness
  - sorted_imports
  - explicit_init
  - unused_optional_binding
  - pattern_matching_keywords
  - implicit_getter
  - syntactic_sugar

analyzer_rules:
  - unused_import

reporter: xcode
